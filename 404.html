<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="refresh" content="0; url=/miss-geyers-classroom/" />
    <script>
        // Client-side redirect for GitHub Pages React Router
        var l = window.location;
        var repo = "/miss-geyers-classroom";
        var redirect = repo + "/#" + l.pathname.replace(repo, "");
        if (l.search) redirect += l.search;
        if (l.hash) redirect += l.hash;
        window.location.replace(redirect);
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
